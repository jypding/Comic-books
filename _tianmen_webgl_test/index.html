<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>视觉调控工作台 · 8771</title>
<style>
  html, body {
    margin: 0; height: 100%;
    background: #1a1a1a; color: #eee;
    font-family: -apple-system, "Segoe UI", monospace;
    display: flex; align-items: center; justify-content: center;
  }
  .wrap { text-align: center; max-width: 900px; }
  h1 { font-weight: 400; font-size: 24px; letter-spacing: 0.08em; margin-bottom: 8px; color: #4fc; }
  .sub { font-size: 12px; color: #888; margin-bottom: 48px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
  a.card {
    display: block; text-decoration: none; color: inherit;
    background: #2a2a2a; border: 1px solid #333; border-radius: 12px;
    padding: 40px 20px; transition: all 0.15s;
  }
  a.card:hover { background: #333; border-color: #4fc; transform: translateY(-3px); }
  a.card .icon { font-size: 40px; margin-bottom: 16px; display: block; }
  a.card .name { font-size: 18px; color: #4fc; margin-bottom: 8px; letter-spacing: 0.1em; }
  a.card .desc { font-size: 11px; color: #888; line-height: 1.6; }
  a.card.disabled { opacity: 0.4; pointer-events: none; }
  .foot { font-size: 11px; color: #555; margin-top: 48px; line-height: 1.8; }
  .foot a { color: #4fc; text-decoration: none; }
  .foot a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="wrap">
  <h1>视觉调控工作台</h1>
  <div class="sub">localhost:8771</div>

  <div class="grid">
    <a class="card" href="./3d.html">
      <span class="icon">◐</span>
      <div class="name">黑白</div>
      <div class="desc">Black / White<br>灰度 · 阈值 · 墨色 · 排线</div>
    </a>
    <a class="card disabled" href="./color.html">
      <span class="icon">◕</span>
      <div class="name">彩色</div>
      <div class="desc">Color<br>饱和度 · 色调 · 对比度<br>（待开发）</div>
    </a>
    <a class="card disabled" href="./video.html">
      <span class="icon">▶</span>
      <div class="name">视频</div>
      <div class="desc">Video / Animation<br>时间轴 · 转场 · 特效<br>（待开发）</div>
    </a>
  </div>

  <div class="foot">
    其他入口：<a href="./picture.html">图片调节</a> · <a href="./3d.html">3D 调节</a> · <a href="./style_grayscale.json">style_grayscale.json</a>
  </div>
</div>
</body>
</html>
