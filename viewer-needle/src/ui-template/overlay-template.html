<!-- UI浮层模板，仅DOM结构，业务数据全部由book/*.json注入 -->
<div class="comic-overlay">
  <!-- 对话框 -->
  <div class="dialog-box">
    <div class="dialog-speaker">{{speakerName}}</div>
    <div class="dialog-text">{{dialogContent}}</div>
  </div>

  <!-- 字幕区域 -->
  <div class="subtitle-area">{{subtitleText}}</div>

  <!-- 交互按钮、翻页控件 -->
  <div class="control-panel">
    <button class="btn-prev">上一页</button>
    <button class="btn-next">下一页</button>
  </div>

  <!-- 特效容器：闪光、震动等特效挂载节点 -->
  <div class="effect-layer"></div>
</div>
